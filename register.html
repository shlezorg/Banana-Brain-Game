<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Banana Brain Challenge</title>
    <link rel="stylesheet" href="auth.css">
    <script src="auth.js" defer></script>
</head>
<body>
    <main class="auth-shell">

        <a class="brand" href="login.html">
            <span class="brand-mark">🍌</span>
            <span>banana<span class="brand-light">brain</span></span>
        </a>

        <section class="auth-card">

            <div class="auth-heading">
                <p class="eyebrow">JOIN THE CHALLENGE</p>
                <h1>Create your account<span>.</span></h1>
                <p>Save your progress and build your puzzle-solving streak.</p>
            </div>

            <form id="register-form">

                <label for="register-name">Display name</label>
                <input
                    id="register-name"
                    type="text"
                    placeholder="How should we call you?"
                    maxlength="30"
                    autocomplete="name"
                    required
                >

                <label for="register-email">Email address</label>
                <input
                    id="register-email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

                <label for="register-password">Password</label>
                <input
                    id="register-password"
                    type="password"
                    placeholder="At least 6 characters"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <label for="confirm-password">Confirm password</label>
                <input
                    id="confirm-password"
                    type="password"
                    placeholder="Enter your password again"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <p id="register-message" class="form-message"></p>

                <button class="primary-button full-button" type="submit">
                    Create account <span>↗</span>
                </button>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Sign in</a>
            </p>

            <p class="demo-note">
                Prototype only. Do not use a real or reused password.
            </p>

        </section>

        <footer class="page-footer">
            BANANA BRAIN CHALLENGE • AUTHENTICATION PROTOTYPE
        </footer>

    </main>
</body>
</html>
